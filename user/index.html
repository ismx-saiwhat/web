<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abriendo SofIA...</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #E2EBFA;
            color: #1A2B4B;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #8DA9E6;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        h2 {
            margin-bottom: 10px;
        }

        p {
            color: #5A6B8B;
            margin-bottom: 30px;
        }

        .btn {
            background-color: #8DA9E6;
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
        }

        .store-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }

        .store-badge img {
            height: 40px;
        }
    </style>
    <script>
        window.onload = function () {
            // Attempt to retrieve the ID from the URL
            const urlParams = new URLSearchParams(window.location.search);
            const userId = urlParams.get('id');

            if (userId) {
                // Try to open the app with a custom scheme
                window.location.href = 'sofia://user?id=' + userId;

                // Fallback: If app doesn't open after a timeout, user stays here
                setTimeout(function () {
                    document.getElementById('fallback-content').style.display = 'block';
                    document.getElementById('loading').style.display = 'none';
                }, 2000);
            } else {
                // No ID provided, just redirect to home
                window.location.href = '../index.html';
            }
        };
    </script>
</head>

<body>
    <div id="loading">
        <div class="spinner"></div>
        <h2>Abriendo SofIA...</h2>
    </div>

    <div id="fallback-content" style="display:none;">
        <h2>¿No tienes la App?</h2>
        <p>Parece que no tienes SofIA instalada o el enlace no funcionó.</p>
        <div class="store-buttons">
            <a href="#" class="store-badge">
                <img src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg"
                    alt="Get it on Google Play">
            </a>
            <a href="#" class="store-badge">
                <img src="https://upload.wikimedia.org/wikipedia/commons/3/3c/Download_on_the_App_Store_Badge.svg"
                    alt="Download on the App Store">
            </a>
        </div>
        <div style="margin-top: 20px;">
            <a href="../index.html" style="color: #5A6B8B; text-decoration: none; font-size: 0.9rem;">Ir a la página
                principal</a>
        </div>
    </div>
</body>

</html>
